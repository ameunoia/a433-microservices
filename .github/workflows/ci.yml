name: ci-pipeline
on:
  push:
    branches:
      - karsajobs
jobs:
  lint-dockerfile:
    runs-on: ubuntu:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Install hadolint
        run: |
          sudo apt-get update
          sudo apt-get install -y hadolint
      - name: Lint Dockerfile
        run: hadolint Dockerfile
  test-app:
    runs-on: ubuntu:latest
    if: github.ref == 'refs/heads/karsajobs'
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: "1.15"
      - name: Run tests
        run: go test -v -short --count=1 $(go list ./..)
  build-app-karsajobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run build and push script
        run: bash build_push_image_karsajobs.sh
        env:
          CR_PAT: ${{ secrets.CR_PAT }}
